<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Items - JAC Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">JAC Store</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="items.html">All Items</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="section-title" style="color:#333;">All Products</h2>
        
        <div class="grid" id="products-grid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 JAC Store • <a href="admin.html" style="color:#ff6b6b;">Admin Panel</a></p>
    </footer>

    <script>
        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:white;">Loading products...</p>';

            try {
                const response = await fetch('products.json');
                const data = await response.json();
                const products = data.products || [];

                grid.innerHTML = '';

                if (products.length === 0) {
                    grid.innerHTML = `
                        <p style="grid-column: 1/-1; text-align:center; color:white;">
                            No products yet.<br><br>
                            <a href="admin.html" style="color:#ff6b6b; font-size:1.1rem;">Go to Admin Panel</a> to add your 100 products.
                        </p>`;
                    return;
                }

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${product.image || 'https://picsum.photos/id/20/600/400'}" alt="${product.title}">
                        <div class="card-content">
                            <h3>${product.title}</h3>
                            <p>${product.description}</p>
                            <div class="price">RM ${product.price}</div>
                            <button class="btn" onclick="alert('Product: ${product.title}\\nPrice: RM ${product.price}\\n\\nDetail page coming soon')">View Details</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:white;">Error loading products. Please make sure products.json exists.</p>`;
            }
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
